<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fb;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
        }

        .logo img {
            width: 80px;
            height: 80px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
            font-size: 18px;
        }

        .nav-links .btn {
            background-color: black;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #333;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 42px;
        }

        .subtitle {
            color: gray;
            margin-bottom: 40px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        label {
            font-size: 18px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 8px;
        }

        .goal-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .save-btn {
            margin-top: 30px;
            background-color: black;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .save-btn:hover {
            background-color: #333;
        }
    </style>

</head>

<body>
<nav>
    <div class="logo">
        <a href="/">
        <img src="https://cdn.britannica.com/98/235798-050-3C3BA15D/Hamburger-and-french-fries-paper-box.jpg" alt="logo">
        </a>
    </div>

    <div class="nav-links">
        <!--        <a href="about.html">About</a>-->
        <a href="/admin/users" class="btn">database</a>
        <form action="/dashboard/dashboard" method="post"><button class="btn" type="submit">Home</button></form>
        <form action="/logout" method="post"><button class="btn" type="submit" style="font-size: 18px">Log out</button></form>
    </div>
</nav>

<div class="container">
    <h2>Welcome <span th:text="${name}">name</span></h2>
</div>
</body>
</html>
