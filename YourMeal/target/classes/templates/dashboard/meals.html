<!DOCTYPE html>
<html lang="en">
<head>
    <title>Meals | MealMate</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background: #111;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar a,
        .sidebar button {
            display: block;
            width: 100%;
            text-decoration: none;
            color: white;
            background: none;
            border: none;
            text-align: left;
            font-size: 16px;
            padding: 12px 0;
            cursor: pointer;
            opacity: 0.9;
        }

        .sidebar a:hover,
        .sidebar button:hover {
            opacity: 0.5;
        }

        /* MAIN */

        .main {
            margin-left: 240px;
            padding: 40px;
        }

        .title {
            font-size: 34px;
            font-weight: bold;
        }

        .subtitle {
            color: gray;
            margin-top: 5px;
            margin-bottom: 35px;
        }

        /* MEAL GRID */

        .meal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        /* MEAL CARD */

        .meal-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            transition: .2s;
        }

        .meal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,.12);
        }

        .meal-card label {
            display: block;
            cursor: pointer;
        }

        .meal-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #ddd;
        }

        .meal-content {
            padding: 18px;
        }

        .meal-content h3 {
            margin-bottom: 10px;
            font-size: 22px;
        }

        .meal-content p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .save-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .save-row input {
            transform: scale(1.2);
        }

        .save-btn {
            margin-top: 25px;
            padding: 12px 24px;
            background: black;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .save-btn:hover {
            background: #333;
        }

        .message {
            color: gray;
            font-size: 18px;
            margin-top: 20px;
        }

    </style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>MealMate</h2>

    <a href="/dashboard/dashboard">Dashboard</a>
    <a href="/dashboard/meals">Meals</a>
    <a href="planner.html">Planner</a>
    <a href="grocery.html">Grocery</a>
    <a href="settings.html">Settings</a>

    <form action="/logout" method="post">
        <button type="submit">Logout</button>
    </form>

</div>

<!-- MAIN -->

<div class="main">

    <div class="title">Meals</div>
    <div class="subtitle">
        Select meals you would like to save.
    </div>

    <form action="/dashboard/meals" method="post">

        <div class="meal-grid">

            <div class="meal-card"
                 th:if="${hasRecommendations}"
                 th:each="meal : ${recommendations}">

                <label>

                    <!-- Image -->
                    <img class="meal-image"
                         th:src="${meal.imageUrl()}"
                         src="/images/default-meal.jpg"
                         alt="Meal Image">

                    <div class="meal-content">

                        <!-- Meal Name -->
                        <h3 th:text="${meal.name()}">
                            Chicken Alfredo
                        </h3>

                        <!-- Short Description -->
                        <p th:text="${meal.description()}">
                            Creamy pasta with grilled chicken and parmesan cheese.
                        </p>

                        <!-- Save Checkbox -->
                        <div class="save-row">
                            <input type="checkbox"
                                   name="meal"
                                   th:value="${meal.name()}">

                            <span>Save Meal</span>
                        </div>

                    </div>

                </label>

            </div>

        </div>

        <p class="message"
           th:unless="${hasRecommendations}"
           th:text="${recommendationStatus}">
            No meals available.
        </p>

        <button class="save-btn" type="submit">
            Save Selected Meals
        </button>

    </form>

</div>

</body>
</html>
