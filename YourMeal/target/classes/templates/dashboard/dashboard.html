<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MealMate Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{

    min-height:100vh;

    overflow-x:hidden;

    color:white;

    background:
    radial-gradient(circle at top left,#2563eb55,transparent 40%),
    radial-gradient(circle at bottom right,#7c3aed55,transparent 40%),
    linear-gradient(135deg,#0f172a,#111827,#020617);

}

/* floating blobs */

body::before{

    content:"";

    position:fixed;

    width:350px;

    height:350px;

    background:#2563eb55;

    border-radius:50%;

    filter:blur(120px);

    top:-120px;

    left:-100px;

    animation:float1 12s infinite alternate;

    z-index:-1;

}

body::after{

    content:"";

    position:fixed;

    width:320px;

    height:320px;

    background:#9333ea55;

    border-radius:50%;

    filter:blur(120px);

    right:-100px;

    bottom:-120px;

    animation:float2 14s infinite alternate;

    z-index:-1;

}

@keyframes float1{

from{

transform:translate(0,0);

}

to{

transform:translate(120px,80px);

}

}

@keyframes float2{

from{

transform:translate(0,0);

}

to{

transform:translate(-100px,-60px);

}

}

/* hamburger */

.menu{

    position:fixed;

    top:22px;

    left:22px;

    width:55px;

    height:55px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:16px;

    cursor:pointer;

    z-index:1001;

    transition:.3s;

    font-size:28px;

}

.menu:hover{

    background:#2563eb;

    transform:scale(1.08);

}

/* sidebar */

.sidebar{

    position:fixed;

    top:0;

    left:-280px;

    width:260px;

    height:100vh;

    background:rgba(15,23,42,.95);

    backdrop-filter:blur(30px);

    border-right:1px solid rgba(255,255,255,.08);

    transition:.35s;

    z-index:1000;

    padding:30px;

}

.sidebar.active{

    left:0;

}

.logo{

    font-size:32px;

    font-weight:700;

    margin-top:60px;

    margin-bottom:40px;

}

.sidebar a,
.sidebar button{

    width:100%;

    display:block;

    text-decoration:none;

    color:white;

    padding:16px;

    margin-bottom:10px;

    border-radius:14px;

    transition:.25s;

    background:none;

    border:none;

    text-align:left;

    cursor:pointer;

    font-size:16px;

}

.sidebar a:hover{

    background:#2563eb;

    transform:translateX(8px);

}

.sidebar button:hover{

    background:#dc2626;

}

/* main */

.main{

    padding:40px;

    transition:.35s;

}

.main.active{

    margin-left:260px;

}

.hero{

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    margin-top:80px;

    margin-bottom:35px;

}

.hero h1{

    font-size:48px;

}

.hero p{

    margin-top:8px;

    color:#cbd5e1;

}

.avatar{

    width:65px;

    height:65px;

    border-radius:50%;

    background:linear-gradient(135deg,#2563eb,#9333ea);

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:28px;

    font-weight:bold;

    box-shadow:0 0 25px rgba(37,99,235,.6);

}

/* cards */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:22px;

}

.card{

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

padding:28px;

border-radius:24px;

border:1px solid rgba(255,255,255,.08);

transition:.3s;

box-shadow:0 12px 30px rgba(0,0,0,.25);

}

.card:hover{

transform:translateY(-10px);

box-shadow:0 18px 45px rgba(37,99,235,.35);

}

.card-icon{

font-size:34px;

margin-bottom:15px;

}

.card small{

color:#cbd5e1;

}

.card h2{

margin-top:12px;

font-size:40px;

}
window.addEventListener("load", () => {

    const cards = document.querySelectorAll(".card");
    const panels = document.querySelectorAll(".panel");

    [...cards, ...panels].forEach((item, index) => {

        item.style.opacity = "0";
        item.style.transform = "translateY(25px)";

        setTimeout(() => {
            item.style.transition = "all .6s ease";
            item.style.opacity = "1";
            item.style.transform = "translateY(0)";
        }, index * 120);

    });

});

</script>

</body>
</html>
