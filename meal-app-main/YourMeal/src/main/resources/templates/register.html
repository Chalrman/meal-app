<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
        }

        .logo img {
            width: 80px;
            height: 80px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
            font-size: 18px;
        }

        .nav-links .btn {
            background-color: black;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #333;
        }

        .container {
            margin-top: 80px;
        }

        h1 {
            font-size: 50px;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 300px;
            margin: 0 auto;
            gap: 15px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        .link {
            margin-top: 15px;
        }

        .link a {
            color: black;
            text-decoration: none;
        }
    </style>
</head>

<body>
<nav>
    <div class="logo">
        <img src="https://cdn.britannica.com/98/235798-050-3C3BA15D/Hamburger-and-french-fries-paper-box.jpg" alt="logo">
    </div>

    <div class="nav-links">
<!--        <a href="about.html">About</a>-->
        <a href="/login">Sign In</a>
        <a href="/register" class="btn">Get Started</a>
        <a href="/">Home</a>
    </div>
</nav>

<div class="container">
    <h1>Sign Up</h1>

    <form class="login-form" action="/register" method="post">
        <p class="form-error" th:if="${registerError}" th:text="${registerError}"></p>

        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>

        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required>

        <button class="button" type="submit">Create Account</button>
    </form>

    <div class="link">
        <p>Already have an account? <a href="/login">Sign In</a></p>
    </div>
</div>

</body>
</html>
